
name: Zero-Secret Tailscale SSH Session

on:
  workflow_dispatch:

jobs:
  ssh-debug:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 40

    steps:
      - name: Setup SSH Server and User
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y openssh-server

          # Ensure runner account exists
          id runner

          # Use repo secret when provided, otherwise generate a one-time password
          if [ -z "$SSH_PASSWORD" ]; then
            SSH_PASSWORD="$(openssl rand -base64 24 | tr -d '\n')"
            echo "::warning::SSH_PASSWORD secret not set. Generated one-time password for this run."
          fi

          echo "::add-mask::$SSH_PASSWORD"
          echo "runner:$SSH_PASSWORD" | sudo chpasswd

          # Enable password authentication
          sudo mkdir -p /etc/ssh/sshd_config.d

          sudo tee /etc/ssh/sshd_config.d/00-github-runner.conf > /dev/null <<EOF
          PasswordAuthentication yes
          KbdInteractiveAuthentication no
          PermitRootLogin no
          EOF

          sudo sshd -t
          sudo systemctl enable --now ssh
          sudo systemctl restart ssh

          echo "SSH server is ready."

      - name: Install Tailscale
        run: |
          set -e

          curl -fsSL https://tailscale.com/install.sh -o install-tailscale.sh
          sudo bash install-tailscale.sh

          echo "Tailscale installed successfully."

      - name: Authenticate Tailscale
        run: |
          set +e

          echo "=========================================================="
          echo "STEP 1: AUTHORIZE THE GITHUB RUNNER"
          echo "=========================================================="

          sudo tailscale up --hostname=github-runner-debug

          echo ""
          echo "Waiting for Tailscale authentication..."

          for i in {1..36}; do
            TAILSCALE_IP=$(sudo tailscale ip -4 2>/dev/null | head -n 1)

            if [ -n "$TAILSCALE_IP" ]; then
              echo "=========================================================="
              echo "TAILSCALE CONNECTED"
              echo "=========================================================="
              echo "Tailscale IP: $TAILSCALE_IP"
              echo "SSH Username: runner"
              echo "SSH Command: ssh runner@$TAILSCALE_IP"
              echo "=========================================================="
              break
            fi

            if [ "$i" -eq 36 ]; then
              echo "Authentication timeout."
              exit 1
            fi

            sleep 5
          done

          echo ""
          echo "Session active for 30 minutes."
          echo "Keep this workflow running while connected."

          sleep 1800

      - name: Cleanup
        if: always()
        run: |
          sudo tailscale down || true
          sudo systemctl stop ssh || true
          echo "Runner SSH session closed."
