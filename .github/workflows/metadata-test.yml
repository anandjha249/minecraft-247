name: Parallel Metadata Test

on:
  workflow_dispatch: # Manual "Run workflow" button

jobs:
  fetch-metadata:
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        runner_id: [1, 2, 3, 4, 5, 6]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Query IMDS Metadata and Save JSON
        run: |
          echo "Running on Machine Matrix ID: ${{ matrix.runner_id }}"
          
          # Execute your curl + python formatting command and save it uniquely
          curl -s -H "Metadata:true" "http://169.254.169" | python3 -m json.tool > runner${{ matrix.runner_id }}.json
          
          # Print the output to the GitHub logs
          echo "=== Content of runner${{ matrix.runner_id }}.json ==="
          cat runner${{ matrix.runner_id }}.json

      - name: Upload JSON File as an Artifact
        uses: actions/upload-artifact@v4  # Corrected Action reference
        with:
          name: runner${{ matrix.runner_id }}-metadata
          path: runner${{ matrix.runner_id }}.json
