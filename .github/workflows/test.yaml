name: Cloud Provider IMDS Check

on:
  workflow_dispatch:

jobs:
  check-cloud:
    runs-on: ubuntu-latest

    steps:
      - name: Run Cloud Discovery Script
        shell: bash
        run: |
          cat << 'EOF' > test_imds.sh
          #!/usr/bin/env bash

          set +e

          test_endpoint() {
              name="$1"
              url="$2"
              shift 2

              echo ""
              echo "=========================================="
              echo "Testing: $name"
              echo "Endpoint: $url"
              echo "=========================================="

              body=$(mktemp)

              result=$(curl -sS \
                  --connect-timeout 3 \
                  --max-time 3 \
                  --noproxy '*' \
                  -o "$body" \
                  -w "%{http_code}|%{remote_ip}|%{time_total}" \
                  "$@" "$url" 2>&1)

              exit_code=$?

              if [ $exit_code -eq 0 ]; then
                  http_code=$(echo "$result" | cut -d'|' -f1)
                  remote_ip=$(echo "$result" | cut -d'|' -f2)
                  duration=$(echo "$result" | cut -d'|' -f3)

                  if [ "$http_code" = "200" ]; then
                      echo "STATUS: SUCCESS"
                      echo "HTTP: $http_code"
                      echo "IP: $remote_ip"
                      echo "TIME: ${duration}s"
                      echo ""
                      echo "---------- METADATA BEGIN ----------"
                      cat "$body"
                      echo ""
                      echo "----------- METADATA END -----------"
                  else
                      echo "STATUS: HTTP $http_code"
                      echo "Response: $(cat "$body")"
                  fi
              else
                  echo "STATUS: FAILED"
                  echo "Error: $result"
              fi

              rm -f "$body"
          }

          echo "=========================================="
          echo " CLOUD PROVIDER IMDS DISCOVERY"
          echo "=========================================="

          # AWS
          test_endpoint "AWS EC2" \
            "http://169.254.169.254/latest/meta-data/"

          # Microsoft Azure
          test_endpoint "Microsoft Azure" \
            "http://169.254.169.254/metadata/instance?api-version=2021-02-01" \
            -H "Metadata: true"

          # Google Cloud
          test_endpoint "Google Cloud" \
            "http://metadata.google.internal/computeMetadata/v1/" \
            -H "Metadata-Flavor: Google"

          # Oracle Cloud
          test_endpoint "Oracle Cloud" \
            "http://169.254.169.254/opc/v2/instance/" \
            -H "Authorization: Bearer Oracle"

          # Alibaba Cloud
          test_endpoint "Alibaba Cloud" \
            "http://100.100.100.200/latest/meta-data/"

          # Tencent Cloud
          test_endpoint "Tencent Cloud" \
            "http://metadata.tencentyun.com/latest/meta-data/"

          # IBM Cloud
          test_endpoint "IBM Cloud" \
            "http://169.254.169.254/metadata/v1/instance"

          # DigitalOcean
          test_endpoint "DigitalOcean" \
            "http://169.254.169.254/metadata/v1/"

          # Hetzner Cloud
          test_endpoint "Hetzner Cloud" \
            "http://169.254.169.254/hetzner/v1/metadata"

          echo ""
          echo "=========================================="
          echo " ALL TESTS COMPLETED"
          echo "=========================================="
          EOF

          chmod +x test_imds.sh
          ./test_imds.sh
