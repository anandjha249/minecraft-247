name: Pterodactyl Panel

on:
  workflow_dispatch:
    inputs:
      hours:
        description: "How long to keep it running (max ~5.5)"
        default: "5"

env:
  PTERO_DIR: /home/runner/ptero

jobs:
  panel:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          hostname: pterodactyl-gha

      - name: Prepare compose files
        run: |
          TS_IP=$(tailscale ip -4)
          mkdir -p "$PTERO_DIR"/{var,logs,db}
          cd "$PTERO_DIR"

          echo "APP_URL=http://${TS_IP}" > .env

          cat > docker-compose.yml <<'EOF'
          services:
            database:
              image: mariadb:10.5
              restart: always
              volumes:
                - ./db:/var/lib/mysql
              environment:
                MYSQL_DATABASE: panel
                MYSQL_USER: pterodactyl
                MYSQL_PASSWORD: ptero_db_pass
                MYSQL_ROOT_PASSWORD: ptero_root_pass
              healthcheck:
                test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -pptero_root_pass --silent"]
                interval: 5s
                timeout: 5s
                retries: 30

            cache:
              image: redis:alpine
              restart: always

            panel:
              image: ghcr.io/pterodactyl/panel:latest
              restart: always
              ports:
                - "80:80"
              depends_on:
                database:
                  condition: service_healthy
                cache:
                  condition: service_started
              volumes:
                - ./var:/app/var
                - ./logs:/app/storage/logs
              environment:
                APP_URL: "${APP_URL}"
                APP_ENV: "production"
                APP_ENVIRONMENT_ONLY: "false"
                APP_TIMEZONE: "UTC"
                APP_SERVICE_AUTHOR: "admin@example.com"
                DB_HOST: database
                DB_PORT: "3306"
                DB_DATABASE: panel
                DB_USERNAME: pterodactyl
                DB_PASSWORD: ptero_db_pass
                CACHE_DRIVER: redis
                SESSION_DRIVER: redis
                QUEUE_DRIVER: redis
                REDIS_HOST: cache
                MAIL_DRIVER: "log"
                TRUSTED_PROXIES: "*"
          EOF

      - name: Start panel
        working-directory: /home/runner/ptero
        run: |
          docker compose up -d
          echo "Waiting for panel to boot..."
          ok=0
          for i in {1..60}; do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost/auth/login || true)
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            echo "=== docker compose ps ==="
            docker compose ps -a
            echo "=== panel logs ==="
            docker compose logs --tail=150 panel
            echo "=== database logs ==="
            docker compose logs --tail=50 database
            exit 1
          fi

      - name: Create admin user
        working-directory: /home/runner/ptero
        run: |
          for i in {1..5}; do
            if docker compose exec -T panel php artisan p:user:make \
              --email=admin@example.com \
              --username=admin \
              --name-first=Admin \
              --name-last=User \
              --password='ChangeMe123!' \
              --admin=1; then
              exit 0
            fi
            echo "retry $i..."; sleep 10
          done
          exit 1

      - name: Show access info
        run: |
          echo "=============================================="
          echo " Panel URL: http://$(tailscale ip -4)"
          echo " Login:     admin@example.com / ChangeMe123!"
          echo "=============================================="

      - name: Keep alive
        run: |
          END=$(( $(date +%s) + ${{ inputs.hours }} * 3600 ))
          while [ $(date +%s) -lt $END ]; do sleep 60; done

      - name: Dump logs on failure
        if: failure()
        working-directory: /home/runner/ptero
        run: docker compose logs --tail=200
